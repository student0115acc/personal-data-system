<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>個人資料整理系統</title>
<style>
  body { font-family: "Microsoft JhengHei", sans-serif; margin: 2rem; }
  select, button, input, textarea { font-size: 1rem; padding: 0.3rem 0.6rem; }
  button { margin-right: 0.5rem; cursor: pointer; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; vertical-align: top; }
  th { background: #f0f0f0; }
  #status { color: #666; margin-top: 0.5rem; }
  fieldset { margin-top: 1.5rem; max-width: 500px; }
  fieldset label { display: block; margin-bottom: 0.6rem; }
  fieldset input, fieldset textarea { width: 100%; box-sizing: border-box; }
  .rowActions button { font-size: 0.85rem; padding: 0.2rem 0.5rem; }
  .revealBtn { font-size: 0.8rem; padding: 0.1rem 0.4rem; }
</style>
</head>
<body>
  <h1>個人資料整理系統（開發中）</h1>

  <label>API 網址：
    <input id="apiUrl" type="text" size="70" placeholder="貼上 Apps Script Web App 網址" />
  </label>
  <br /><br />

  <label>工作表：
    <select id="sheetName">
      <option>工作紀錄</option>
      <option>環境疑難雜症</option>
      <option>學習筆記</option>
      <option>備忘錄</option>
      <option>帳密資料</option>
      <option>採購紀錄</option>
    </select>
  </label>
  <button id="loadBtn">讀取</button>
  <div id="status"></div>

  <div id="rebateBalanceCard" style="display:none; margin-top:0.8rem; padding:0.8rem 1.2rem; background:#eef6ee; border:1px solid #9c9; border-radius:6px; max-width:300px;">
    可用回饋金餘額：<strong id="rebateBalanceValue">0</strong> 元
  </div>

  <div id="filterBar" style="margin-top:0.8rem; display:none;">
    <label>關鍵字：<input id="keywordFilter" type="text" size="30" placeholder="搜尋標題/內容/子標籤" /></label>
    <label id="subTag1FilterLabel">子標籤①：
      <select id="subTag1Filter"><option value="">全部</option></select>
    </label>
    <label id="subTag2FilterLabel">子標籤②：
      <select id="subTag2Filter"><option value="">全部</option></select>
    </label>
  </div>

  <table id="resultTable" style="display:none;">
    <thead><tr id="headerRow"></tr></thead>
    <tbody id="bodyRows"></tbody>
  </table>

  <fieldset>
    <legend>綜合搜尋（同時查工作紀錄／環境疑難雜症／學習筆記／備忘錄）</legend>
    <label>關鍵字：<input id="globalKeyword" type="text" size="30" /></label>
    <button id="globalSearchBtn">搜尋全部</button>
    <div id="globalStatus"></div>
    <table id="globalResultTable" style="display:none;">
      <thead><tr><th>工作表</th><th>標題</th><th>內容</th></tr></thead>
      <tbody id="globalResultBody"></tbody>
    </table>
  </fieldset>

  <fieldset>
    <legend id="formTitle">新增一筆到目前選的工作表</legend>
    <div id="formFields"></div>
    <button id="addBtn">新增</button>
    <button id="cancelEditBtn" style="display:none;">取消編輯</button>
    <div id="addStatus"></div>
  </fieldset>

  <script type="module">
    import { encryptPassword, decryptPassword } from '../src/credentials/passwordCrypto.js';
    import { computeDisplayStatus } from '../src/purchases/computeDisplayStatus.js';
    import { computeAvailableRebateBalance } from '../src/purchases/computeAvailableRebateBalance.js';

    // 固定金鑰：寫死在前端程式碼中（規格書 v2 定案 R2-Q3(a)）。這層加密
    // 主要防「不小心分享 Sheets 檢視權限」，不是防真正的攻擊者，所以
    // 不需要每次登入輸入密碼解鎖。
    const PASSWORD_PASSPHRASE = 'personal-data-system-2026-verdipeng';

    // 每張工作表在「新增/編輯」表單裡要出現哪些欄位，依序決定表單長相。
    // 陣列項目可以是純字串（預設文字輸入框），也可以是
    // { name, type: 'select'|'checkbox', options } 指定成下拉或勾選框。
    const SHEET_FIELD_CONFIGS = {
      工作紀錄: ['子標籤①', '子標籤②', '標題', '內容'],
      環境疑難雜症: ['子標籤①', '子標籤②', '標題', '內容'],
      學習筆記: ['子標籤①', '子標籤②', '標題', '內容'],
      備忘錄: [
        '標題',
        '內容',
        { name: '截止日期', type: 'date' },
        {
          name: '提醒設定',
          type: 'select',
          options: ['', '準時', '提前1天', '提前3天', '提前1週'],
        },
        { name: '完成狀態', type: 'checkbox' },
      ],
      帳密資料: ['子標籤①（對象/系統）', '子標籤②（類型）', '網站/系統名稱', '帳號', '密碼', '網址', '備註'],
      採購紀錄: [
        '購買日期',
        { name: '歸屬/請款單位', type: 'dynamic-select', settingsKey: '採購-歸屬單位' },
        '使用單位/經手人',
        { name: '採購類型', type: 'select', options: ['公用採購', '個人採購'] },
        '物品名稱',
        '金額（台幣）',
        { name: '支付卡別', type: 'dynamic-select', settingsKey: '採購-支付卡別' },
        '信用卡回饋金',
        { name: '款項屬性', type: 'select', options: ['需請款撥款', '自用', '回饋金已抵用'] },
        { name: '到貨狀態', type: 'select', options: ['未到貨', '已到貨'] },
        { name: '請款狀態', type: 'select', options: ['未請款', '已請款'] },
        { name: '撥款狀態', type: 'select', options: ['未撥款', '已撥款'] },
        { name: '回饋金狀態', type: 'select', options: ['待處理', '已折抵', '已存入回饋池'] },
        { name: '已使用', type: 'checkbox' },
        '發票附件連結',
        '來源網址',
        '備註',
      ],
    };
    const TEXTAREA_FIELDS = new Set(['內容', '備註']);

    function normalizeField(fieldSpec) {
      return typeof fieldSpec === 'string' ? { name: fieldSpec, type: 'text' } : fieldSpec;
    }

    const apiUrlInput = document.getElementById('apiUrl');
    const sheetSelect = document.getElementById('sheetName');
    const statusEl = document.getElementById('status');
    const table = document.getElementById('resultTable');
    const headerRow = document.getElementById('headerRow');
    const bodyRows = document.getElementById('bodyRows');
    const formFieldsEl = document.getElementById('formFields');
    const addStatusEl = document.getElementById('addStatus');
    const formTitle = document.getElementById('formTitle');
    const addBtn = document.getElementById('addBtn');
    const cancelEditBtn = document.getElementById('cancelEditBtn');

    const filterBar = document.getElementById('filterBar');
    const keywordFilter = document.getElementById('keywordFilter');
    const subTag1Filter = document.getElementById('subTag1Filter');
    const subTag2Filter = document.getElementById('subTag2Filter');
    const subTag1FilterLabel = document.getElementById('subTag1FilterLabel');
    const subTag2FilterLabel = document.getElementById('subTag2FilterLabel');

    // 每張表用哪兩個欄位當子標籤①②做篩選；備忘錄沒有子標籤，不顯示篩選。
    const TAG_COLUMNS = {
      工作紀錄: ['子標籤①', '子標籤②'],
      環境疑難雜症: ['子標籤①', '子標籤②'],
      學習筆記: ['子標籤①', '子標籤②'],
      帳密資料: ['子標籤①（對象/系統）', '子標籤②（類型）'],
    };

    apiUrlInput.value = localStorage.getItem('apiUrl') || '';

    let editingRow = null;
    let currentSheetRows = []; // 目前工作表「全部」已讀取的資料（篩選前）
    let currentSheet = '';

    // 欄位名稱幾乎都是中文，\w 正規式對中文字元會全部替換成底線導致
    // 不同欄位撞名（例如「帳號」「網址」都變成 field___），所以改用
    // data-field-name 屬性＋querySelector 來找欄位，不用組字串當 id。
    function getFieldEl(name) {
      return formFieldsEl.querySelector(`[data-field-name="${CSS.escape(name)}"]`);
    }

    // 「設定」表驅動的下拉選項（規格書 4.7 節：選項不寫死在程式碼，
    // 使用者要新增選項時直接去 Sheets 的「設定」表加一列就好）。
    let settingsByType = {};
    let settingsLoaded = false;
    async function ensureSettingsLoaded() {
      if (settingsLoaded) return;
      const apiUrl = apiUrlInput.value.trim();
      if (!apiUrl) return;
      try {
        const data = await jsonp(`${apiUrl}?sheet=${encodeURIComponent('設定')}`);
        if (data.error) return;
        settingsByType = {};
        for (const row of data.rows) {
          const key = row['設定類型'];
          if (!key) continue;
          (settingsByType[key] ??= []).push(row['選項值']);
        }
        settingsLoaded = true;
      } catch {
        // 讀不到設定表就讓動態下拉先空著，不擋住其他功能
      }
    }

    function buildForm() {
      const sheet = sheetSelect.value;
      const fieldSpecs = (SHEET_FIELD_CONFIGS[sheet] || []).map(normalizeField);
      formFieldsEl.innerHTML = '';
      for (const { name, type, options, settingsKey } of fieldSpecs) {
        const label = document.createElement('label');
        label.textContent = name;
        let input;
        if (type === 'select') {
          input = document.createElement('select');
          for (const opt of options) {
            const optionEl = document.createElement('option');
            optionEl.value = opt;
            optionEl.textContent = opt;
            input.appendChild(optionEl);
          }
        } else if (type === 'dynamic-select') {
          input = document.createElement('select');
          const dynOptions = settingsByType[settingsKey] || [];
          const blankOpt = document.createElement('option');
          blankOpt.value = '';
          blankOpt.textContent = dynOptions.length ? '（請選擇）' : '（設定表尚無選項，去 Sheets 新增一列）';
          input.appendChild(blankOpt);
          for (const opt of dynOptions) {
            const optionEl = document.createElement('option');
            optionEl.value = opt;
            optionEl.textContent = opt;
            input.appendChild(optionEl);
          }
        } else if (type === 'checkbox') {
          input = document.createElement('input');
          input.type = 'checkbox';
        } else if (type === 'date') {
          input = document.createElement('input');
          input.type = 'date';
        } else if (TEXTAREA_FIELDS.has(name)) {
          input = document.createElement('textarea');
          input.rows = 4;
        } else {
          input = document.createElement('input');
          input.type = name === '密碼' ? 'password' : 'text';
        }
        input.dataset.fieldName = name;
        label.appendChild(input);
        formFieldsEl.appendChild(label);
      }
    }

    sheetSelect.addEventListener('change', async () => {
      exitEditMode();
      await ensureSettingsLoaded();
      buildForm();
    });
    buildForm();
    ensureSettingsLoaded().then(buildForm);

    function exitEditMode() {
      editingRow = null;
      formTitle.textContent = '新增一筆到目前選的工作表';
      addBtn.textContent = '新增';
      cancelEditBtn.style.display = 'none';
      buildForm();
    }
    cancelEditBtn.addEventListener('click', exitEditMode);

    function jsonp(url) {
      return new Promise((resolve, reject) => {
        const callbackName = `jsonpCallback_${Date.now()}_${Math.floor(Math.random() * 1e6)}`;
        const script = document.createElement('script');
        const cleanup = () => {
          delete window[callbackName];
          script.remove();
        };
        window[callbackName] = (data) => {
          resolve(data);
          cleanup();
        };
        script.onerror = () => {
          reject(new Error('JSONP 請求失敗（網路或網址錯誤）'));
          cleanup();
        };
        const sep = url.includes('?') ? '&' : '?';
        script.src = `${url}${sep}callback=${callbackName}`;
        document.body.appendChild(script);
      });
    }

    async function loadSheet() {
      const apiUrl = apiUrlInput.value.trim();
      const sheet = sheetSelect.value;
      if (!apiUrl) {
        statusEl.textContent = '請先貼上 API 網址';
        return;
      }
      localStorage.setItem('apiUrl', apiUrl);

      statusEl.textContent = '讀取中...';
      table.style.display = 'none';
      try {
        const data = await jsonp(`${apiUrl}?sheet=${encodeURIComponent(sheet)}`);
        if (data.error) {
          statusEl.textContent = '錯誤：' + data.error;
          return;
        }
        const visibleRows = data.rows.filter((r) => r['已刪除'] !== true && r['已刪除'] !== 'TRUE');
        currentSheetRows = visibleRows;
        currentSheet = sheet;
        setupFilterBar(sheet, visibleRows);
        updateRebateBalanceCard(sheet, visibleRows);
        applyFilters();
      } catch (err) {
        statusEl.textContent = '讀取失敗：' + err.message;
      }
    }

    document.getElementById('loadBtn').addEventListener('click', async () => {
      exitEditMode();
      settingsLoaded = false; // 每次按讀取都重新抓一次設定表，抓到你剛加的新選項
      await ensureSettingsLoaded();
      buildForm();
      loadSheet();
    });

    // 採購紀錄頁籤最上方的可用回饋金餘額卡片（規格書 4.2 節，單一數字
    // 卡片，不分卡別統計）。
    function updateRebateBalanceCard(sheet, rows) {
      const card = document.getElementById('rebateBalanceCard');
      if (sheet !== '採購紀錄') {
        card.style.display = 'none';
        return;
      }
      document.getElementById('rebateBalanceValue').textContent =
        computeAvailableRebateBalance(rows).toLocaleString('zh-TW');
      card.style.display = 'block';
    }

    // 依目前工作表決定要不要顯示子標籤篩選、把選項填好（子標籤②只列
    // 出屬於目前選定子標籤①底下的選項，跟新增表單一樣是階層式篩選）。
    function setupFilterBar(sheet, rows) {
      filterBar.style.display = 'block';
      keywordFilter.value = '';
      const tagCols = TAG_COLUMNS[sheet];
      const hasTags = Boolean(tagCols);
      subTag1FilterLabel.style.display = hasTags ? 'inline' : 'none';
      subTag2FilterLabel.style.display = hasTags ? 'inline' : 'none';
      subTag1Filter.innerHTML = '<option value="">全部</option>';
      subTag2Filter.innerHTML = '<option value="">全部</option>';
      if (!hasTags) return;
      const [col1] = tagCols;
      const uniqueTag1 = [...new Set(rows.map((r) => r[col1]).filter(Boolean))].sort();
      for (const v of uniqueTag1) {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        subTag1Filter.appendChild(opt);
      }
    }

    subTag1Filter.addEventListener('change', () => {
      const tagCols = TAG_COLUMNS[currentSheet];
      if (!tagCols) return;
      const [col1, col2] = tagCols;
      subTag2Filter.innerHTML = '<option value="">全部</option>';
      const chosen1 = subTag1Filter.value;
      const scoped = chosen1 ? currentSheetRows.filter((r) => r[col1] === chosen1) : currentSheetRows;
      const uniqueTag2 = [...new Set(scoped.map((r) => r[col2]).filter(Boolean))].sort();
      for (const v of uniqueTag2) {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        subTag2Filter.appendChild(opt);
      }
      applyFilters();
    });
    subTag2Filter.addEventListener('change', applyFilters);
    keywordFilter.addEventListener('input', applyFilters);

    function applyFilters() {
      const tagCols = TAG_COLUMNS[currentSheet];
      const keyword = keywordFilter.value.trim().toLowerCase();
      const filtered = currentSheetRows.filter((row) => {
        if (tagCols) {
          const [col1, col2] = tagCols;
          if (subTag1Filter.value && row[col1] !== subTag1Filter.value) return false;
          if (subTag2Filter.value && row[col2] !== subTag2Filter.value) return false;
        }
        if (keyword) {
          const haystack = Object.values(row).join(' ').toLowerCase();
          if (!haystack.includes(keyword)) return false;
        }
        return true;
      });
      renderTable(filtered, currentSheet);
      statusEl.textContent = `共 ${filtered.length} 筆（${currentSheet}，全部 ${currentSheetRows.length} 筆，不含已刪除）`;
    }

    function renderTable(rows, sheet) {
      headerRow.innerHTML = '';
      bodyRows.innerHTML = '';
      if (rows.length === 0) {
        table.style.display = 'none';
        return;
      }
      const columns = Object.keys(rows[0]).filter((c) => c !== '_row');
      const showDisplayStatus = sheet === '採購紀錄';
      if (showDisplayStatus) {
        const th = document.createElement('th');
        th.textContent = '顯示狀態';
        headerRow.appendChild(th);
      }
      for (const col of columns) {
        const th = document.createElement('th');
        th.textContent = col;
        headerRow.appendChild(th);
      }
      const actionsTh = document.createElement('th');
      actionsTh.textContent = '操作';
      headerRow.appendChild(actionsTh);

      for (const row of rows) {
        const tr = document.createElement('tr');
        if (showDisplayStatus) {
          tr.appendChild(renderDisplayStatusCell(row));
        }
        for (const col of columns) {
          const td = document.createElement('td');
          if (col === '密碼' && row[col]) {
            renderPasswordCell(td, row[col]);
          } else {
            td.innerHTML = String(row[col] ?? '');
          }
          tr.appendChild(td);
        }
        const actionsTd = document.createElement('td');
        actionsTd.className = 'rowActions';

        const editButton = document.createElement('button');
        editButton.textContent = '編輯';
        editButton.addEventListener('click', () => startEdit(row, sheet));
        actionsTd.appendChild(editButton);

        const deleteButton = document.createElement('button');
        deleteButton.textContent = '刪除';
        deleteButton.addEventListener('click', () => deleteRow(row));
        actionsTd.appendChild(deleteButton);

        tr.appendChild(actionsTd);
        bodyRows.appendChild(tr);
      }
      table.style.display = 'table';
    }

    // 規格書 4.2 節顯示狀態燈號建議色 → 實際 CSS 顏色
    const STATUS_COLOR_MAP = {
      gray: '#999',
      blue: '#3b82f6',
      red: '#ef4444',
      orange: '#f97316',
      yellow: '#eab308',
      green: '#22c55e',
    };

    function renderDisplayStatusCell(row) {
      const td = document.createElement('td');
      const status = computeDisplayStatus(row);
      if (status) {
        const badge = document.createElement('span');
        badge.textContent = status.text;
        badge.style.cssText = `padding:0.15rem 0.5rem; border-radius:4px; color:#fff; background:${STATUS_COLOR_MAP[status.color] || '#999'};`;
        td.appendChild(badge);
      }
      return td;
    }

    // 密碼欄位預設用星號遮蔽，按「顯示」才即時解密顯示明文。
    function renderPasswordCell(td, cipherText) {
      const maskedSpan = document.createElement('span');
      maskedSpan.textContent = '••••••••';
      const revealBtn = document.createElement('button');
      revealBtn.className = 'revealBtn';
      revealBtn.textContent = '顯示';
      let revealed = false;
      revealBtn.addEventListener('click', async () => {
        if (revealed) {
          maskedSpan.textContent = '••••••••';
          revealBtn.textContent = '顯示';
          revealed = false;
          return;
        }
        try {
          maskedSpan.textContent = await decryptPassword(cipherText, PASSWORD_PASSPHRASE);
          revealBtn.textContent = '隱藏';
          revealed = true;
        } catch (err) {
          maskedSpan.textContent = '（解密失敗）';
        }
      });
      td.appendChild(maskedSpan);
      td.appendChild(revealBtn);
    }

    function startEdit(row, sheet) {
      editingRow = row._row;
      formTitle.textContent = `編輯第 ${row._row} 列`;
      addBtn.textContent = '更新';
      cancelEditBtn.style.display = 'inline-block';
      buildForm();
      for (const { name, type } of (SHEET_FIELD_CONFIGS[sheet] || []).map(normalizeField)) {
        const el = getFieldEl(name);
        if (!el) continue;
        // 密碼欄位存的是密文，編輯時不預填（要改就整個重打新密碼），
        // 避免不小心把密文原樣存回去。
        if (name === '密碼') continue;
        if (type === 'checkbox') {
          el.checked = row[name] === true || row[name] === 'TRUE';
        } else {
          el.value = row[name] ?? '';
        }
      }
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function submitViaHiddenForm(apiUrl, params) {
      return new Promise((resolve) => {
        const iframeName = `hiddenTarget_${Date.now()}`;
        const iframe = document.createElement('iframe');
        iframe.name = iframeName;
        iframe.style.display = 'none';
        iframe.addEventListener('load', () => {
          resolve();
          setTimeout(() => iframe.remove(), 0);
        });
        document.body.appendChild(iframe);

        const form = document.createElement('form');
        form.method = 'POST';
        form.action = apiUrl;
        form.target = iframeName;
        form.style.display = 'none';
        for (const [name, value] of Object.entries(params)) {
          const input = document.createElement('input');
          input.name = name;
          input.value = value;
          form.appendChild(input);
        }
        document.body.appendChild(form);
        form.submit();
        form.remove();
      });
    }

    addBtn.addEventListener('click', async () => {
      const apiUrl = apiUrlInput.value.trim();
      const sheet = sheetSelect.value;
      if (!apiUrl) {
        addStatusEl.textContent = '請先貼上 API 網址';
        return;
      }

      const fieldSpecs = (SHEET_FIELD_CONFIGS[sheet] || []).map(normalizeField);
      const fields = {};
      for (const { name, type } of fieldSpecs) {
        const el = getFieldEl(name);
        if (!el) continue;
        if (name === '密碼') {
          if (!el.value) continue; // 編輯時留空代表不改密碼
          fields['密碼'] = await encryptPassword(el.value, PASSWORD_PASSPHRASE);
        } else if (type === 'checkbox') {
          fields[name] = el.checked;
        } else {
          fields[name] = el.value;
        }
      }

      const REQUIRED_FIELD_BY_SHEET = {
        帳密資料: '網站/系統名稱',
        採購紀錄: '物品名稱',
      };
      const requiredField = REQUIRED_FIELD_BY_SHEET[sheet] || '標題';
      if (!String(fields[requiredField] ?? '').trim()) {
        addStatusEl.textContent = `請至少填「${requiredField}」`;
        return;
      }

      const isEditing = editingRow !== null;
      addStatusEl.textContent = isEditing ? '更新中...' : '寫入中...';
      try {
        const params = { sheet, fields: JSON.stringify(fields) };
        if (isEditing) {
          params.action = 'update';
          params.row = editingRow;
        }
        await submitViaHiddenForm(apiUrl, params);
        addStatusEl.textContent = '已送出，確認中...';
        await new Promise((r) => setTimeout(r, 2000));
        await loadSheet();
        addStatusEl.textContent = isEditing ? '更新完成' : '新增完成';
        exitEditMode();
      } catch (err) {
        addStatusEl.textContent = '寫入失敗：' + err.message;
      }
    });

    // 綜合搜尋：同時查詢 4 張內容工作表，合併結果並標示來源工作表。
    const GLOBAL_SEARCH_SHEETS = ['工作紀錄', '環境疑難雜症', '學習筆記', '備忘錄'];
    document.getElementById('globalSearchBtn').addEventListener('click', async () => {
      const apiUrl = apiUrlInput.value.trim();
      const keyword = document.getElementById('globalKeyword').value.trim().toLowerCase();
      const globalStatus = document.getElementById('globalStatus');
      const globalTable = document.getElementById('globalResultTable');
      const globalBody = document.getElementById('globalResultBody');
      if (!apiUrl) {
        globalStatus.textContent = '請先貼上 API 網址';
        return;
      }
      if (!keyword) {
        globalStatus.textContent = '請輸入關鍵字';
        return;
      }
      globalStatus.textContent = '搜尋中（依序查 4 張表）...';
      globalTable.style.display = 'none';
      globalBody.innerHTML = '';
      try {
        const results = [];
        for (const sheet of GLOBAL_SEARCH_SHEETS) {
          const data = await jsonp(`${apiUrl}?sheet=${encodeURIComponent(sheet)}`);
          if (data.error) continue;
          for (const row of data.rows) {
            if (row['已刪除'] === true || row['已刪除'] === 'TRUE') continue;
            const haystack = Object.values(row).join(' ').toLowerCase();
            if (haystack.includes(keyword)) {
              results.push({ sheet, row });
            }
          }
        }
        for (const { sheet, row } of results) {
          const tr = document.createElement('tr');
          const sheetTd = document.createElement('td');
          sheetTd.textContent = sheet;
          const titleTd = document.createElement('td');
          titleTd.textContent = row['標題'] ?? '';
          const contentTd = document.createElement('td');
          const content = String(row['內容'] ?? '');
          contentTd.textContent = content.length > 100 ? content.slice(0, 100) + '...' : content;
          tr.append(sheetTd, titleTd, contentTd);
          globalBody.appendChild(tr);
        }
        globalTable.style.display = results.length > 0 ? 'table' : 'none';
        globalStatus.textContent = `共找到 ${results.length} 筆`;
      } catch (err) {
        globalStatus.textContent = '搜尋失敗：' + err.message;
      }
    });

    async function deleteRow(row) {
      const apiUrl = apiUrlInput.value.trim();
      const sheet = sheetSelect.value;
      if (!apiUrl) {
        statusEl.textContent = '請先貼上 API 網址';
        return;
      }
      const label = row['標題'] || row['網站/系統名稱'] || '(無標題)';
      if (!confirm(`確定要刪除「${label}」嗎？（軟刪除，資料仍保留在 Sheets 裡，之後可從原始檔手動復原）`)) {
        return;
      }
      statusEl.textContent = '刪除中...';
      try {
        await submitViaHiddenForm(apiUrl, { sheet, action: 'delete', row: row._row });
        await new Promise((r) => setTimeout(r, 2000));
        await loadSheet();
      } catch (err) {
        statusEl.textContent = '刪除失敗：' + err.message;
      }
    }
  </script>
</body>
</html>
